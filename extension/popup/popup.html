<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet Exit</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main id="popup" aria-busy="true">
    <header>
      <p class="eyebrow">Cookie consent, declined.</p>
      <h1>Quiet Exit</h1>
      <p class="intro">Decline optional cookies on supported banners, then carry on.</p>
    </header>
    <section class="control-panel" aria-label="Cookie banner preferences">
      <label class="switch-row" for="enabled">
        <span><span class="control-title">Automatically decline</span><span id="enabled-state" class="metadata">Loading preference</span></span>
        <input id="enabled" type="checkbox" role="switch" aria-describedby="enabled-help" checked disabled>
      </label>
      <p id="enabled-help" class="help">Essential cookies stay available. Some banners may still need your attention.</p>
    </section>
    <section class="count-panel" aria-labelledby="count-label">
      <p id="count-label" class="metadata">Banners declined</p>
      <output id="denied-count" aria-labelledby="count-label">…</output>
      <p class="help">Counted on this device.</p>
    </section>
    <p id="status" class="status" role="status" aria-live="polite">Loading local settings…</p>
    <button id="retry" type="button" hidden>Try again</button>
    <footer>
      <div class="brand-mark"><img src="../assets/ee-monogram-white.svg" width="24" height="24" alt=""></div>
      <span class="metadata">By Eric Escapes</span>
    </footer>
  </main>
</body>
</html>
